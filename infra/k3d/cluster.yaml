# Cluster local del laboratorio.
#
#   k3d cluster create --config infra/k3d/cluster.yaml
#
# Multi-node a proposito: con un solo nodo, "las tres replicas estan repartidas"
# seria una afirmacion vacia. Con dos agents se puede demostrar que el trafico
# cruza nodos y que matar uno no tumba el servicio.
apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: whatsapp-lab

servers: 1
agents: 2

# Puerto del host hacia el load balancer del cluster, que es por donde entra Traefik.
# Sin este mapeo el Ingress existe pero es inalcanzable desde afuera: el serverlb solo
# publica 6443 (la API de Kubernetes) y nada mas.
#
# 8081 y no 80 para no pedir privilegios ni chocar con lo que ya escuche en el host.
ports:
  - port: 8081:80
    nodeFilters:
      - loadbalancer

# k3s fijado a 1.30 a proposito, para acompañar al kubectl de la maquina de trabajo
# (v1.30.2): la politica de skew de Kubernetes soporta +-1 minor, y con el k3s por
# defecto (1.35) kubectl fallaria de formas confusas. El pin se sube cuando se sube
# kubectl, no antes.
#
# ATENCION al usar el repo desde dos maquinas: este pin es unico para todas. Una
# maquina con kubectl viejo (1.24, el pin anterior era 1.25 por eso) queda a 6 minors
# del server y no puede hablarle. Cambiar este valor NO afecta a un cluster ya creado
# —sigue corriendo la imagen con la que nacio— pero el primer `cluster:up` despues de
# un `cluster:down` lo recrea con esta version. Antes de recrear alla: subir kubectl.
image: rancher/k3s:v1.30.14-k3s1

options:
  k3d:
    wait: true
    timeout: 180s
  k3s:
    extraArgs:
      # El almacenamiento local por nodo alcanza para el PVC de Postgres del lab.
      # Postgres corre con UNA sola replica: esto prueba consistencia de aplicacion
      # y recuperacion de pods, NO alta disponibilidad de la base.
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true

# Sin registry propio: las imagenes se importan con `k3d image import`, asi el
# artefacto que corre en el cluster es exactamente el que se construyo localmente.
